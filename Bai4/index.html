<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx Static Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #1c1e21; margin-bottom: 0.5rem; }
        p { color: #606770; line-height: 1.5; }
        .badge {
            background-color: #e7f3ff;
            color: #1877f2;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Docker Nginx</h1>
        <p>Chào mừng bạn đến với Bài 4. Trang web này là một file HTML tĩnh được phục vụ bởi máy chủ <strong>Nginx</strong>.</p>
        <div class="badge">Status: Online (Port 80)</div>
    </div>
</body>
</html>
