server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

services:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  food-service-url: ${FOOD_SERVICE_URL:http://localhost:8082}
  inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8086}

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
      food-service:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    instances:
      user-service:
        maxAttempts: 3
        waitDuration: 500ms
      food-service:
        maxAttempts: 3
        waitDuration: 500ms
  timelimiter:
    instances:
      user-service:
        timeoutDuration: 3s
      food-service:
        timeoutDuration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
