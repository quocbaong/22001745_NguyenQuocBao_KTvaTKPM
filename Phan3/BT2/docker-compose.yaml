services:
  mongodb:
    image: mongo:latest
    container_name: bt2-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  node-app:
    build: .
    container_name: bt2-node-app
    ports:
      - "3003:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongodb:27017/mydb

volumes:
  mongo_data:
