networks:
  food-network:
    driver: bridge

services:
  # ========================
  # API GATEWAY
  # ========================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_URL=http://user-service:8081
      - FOOD_SERVICE_URL=http://food-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
      - INVENTORY_SERVICE_URL=http://inventory-service:8086
      - SHIPPING_SERVICE_URL=http://shipping-service:8087
    networks:
      - food-network
    depends_on:
      - user-service
      - food-service
      - order-service
      - payment-service
      - notification-service
      - inventory-service
      - shipping-service
    restart: on-failure

  # ========================
  # USER SERVICE
  # ========================
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - JWT_SECRET=minifoods-jwt-secret-key-2024-very-long-secret
    networks:
      - food-network
    restart: on-failure

  # ========================
  # FOOD SERVICE
  # ========================
  food-service:
    build: ./food-service
    container_name: food-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
    networks:
      - food-network
    restart: on-failure

  # ========================
  # ORDER SERVICE
  # ========================
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - USER_SERVICE_URL=http://user-service:8081
      - FOOD_SERVICE_URL=http://food-service:8082
      - INVENTORY_SERVICE_URL=http://inventory-service:8086
    networks:
      - food-network
    depends_on:
      - user-service
      - food-service
      - inventory-service
    restart: on-failure

  # ========================
  # PAYMENT SERVICE
  # ========================
  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - ORDER_SERVICE_URL=http://order-service:8083
      - NOTIFICATION_SERVICE_URL=http://notification-service:8085
      - INVENTORY_SERVICE_URL=http://inventory-service:8086
      - SHIPPING_SERVICE_URL=http://shipping-service:8087
    networks:
      - food-network
    depends_on:
      - order-service
      - notification-service
    restart: on-failure

  # ========================
  # NOTIFICATION SERVICE
  # ========================
  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085
    networks:
      - food-network
    restart: on-failure

  # ========================
  # INVENTORY SERVICE
  # ========================
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8086:8086"
    environment:
      - SERVER_PORT=8086
    networks:
      - food-network
    restart: on-failure

  # ========================
  # SHIPPING SERVICE
  # ========================
  shipping-service:
    build: ./shipping-service
    container_name: shipping-service
    ports:
      - "8087:8087"
    environment:
      - SERVER_PORT=8087
      - ORDER_SERVICE_URL=http://order-service:8083
    networks:
      - food-network
    restart: on-failure

  # ========================
  # FRONTEND (React)
  # ========================
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3001:80"
    networks:
      - food-network
    depends_on:
      - api-gateway
    restart: on-failure
